services:
  frontend:
    user: "${UID:-1000}:${GID:-1000}"
    image: brayand/fullstack-project-template-frontend:1.0.0 
    restart: always
    volumes:
      - .:/app
    ports:
      - 3000:3000
    networks:
      - multi-cv-local
    command: npm run dev

networks:
  multi-cv-local:
    driver: bridge
    external: true
