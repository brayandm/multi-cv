services:
  backend:
    image: multi-cv-backend
    restart: always
    volumes:
      - backend-storage:/var/www/storage
      - backend-app:/var/www
    depends_on:
      - mysql
      - redis
    command: /docker-start.sh
    expose:
      - "9000"
    ports:
      - ${BACKEND_PORT:-49162}:80

  mysql:
    image: multi-cv-mysql
    restart: always
    volumes:
      - 'backend-mysql:/var/lib/mysql'

  redis:
    image: multi-cv-redis
    restart: always
    volumes:
        - 'backend-redis:/data'
    healthcheck:
        test:
            - CMD
            - redis-cli
            - ping
        retries: 20
        timeout: 20s

  frontend:
    image: multi-cv-frontend
    restart: always
    ports:
      - ${APP_PORT:-49160}:3000
    depends_on:
      nginx:
        condition: service_healthy
    command: npm run start

  nginx:
    image: multi-cv-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "${NGINX_PORT:-49163}:80"
    volumes:
      - backend-app:/var/www
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:80/api/v1/ping || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: brayand/fullstack-project-template-phpmyadmin:1.0.0
    restart: always
    environment:
        PMA_HOST: mysql
    ports:
    - '${PHPMYADMIN_PORT:-49161}:80'
    depends_on:
      - mysql

volumes:
  backend-mysql:
  backend-redis:
  backend-storage:
  backend-app: