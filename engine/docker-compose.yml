services:
    engine:
        image: brayand/fullstack-project-template-python-latex-html:1.0.0
        restart: always
        volumes:
            - .:/app
        ports:
            - 91:90
        networks:
            - multi-cv-local
        depends_on:
            engine_redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            mongodb:
                condition: service_healthy
        working_dir: /app
        environment:
            - WORKON_HOME=/app/.venvs/engine
            - PIPENV_VENV_IN_PROJECT=0
            - HOT_RELOAD=${HOT_RELOAD}
        command: >
            sh -c "pipenv install --dev &&
            if [ \"${HOT_RELOAD:-true}\" = \"true\" ]; then
                echo 'Running with --reload'; 
                pipenv run uvicorn app.main:app --reload --host 0.0.0.0 --port 90;
            else
                echo 'Running without --reload'; 
                pipenv run uvicorn app.main:app --host 0.0.0.0 --port 90;
            fi"

    celery:
        user: "${UID:-1000}:${GID:-1000}"
        image: brayand/fullstack-project-template-python-latex-html:1.0.0
        restart: always
        volumes:
            - .:/app
        networks:
            - multi-cv-local
        depends_on:
            engine_redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            mongodb:
                condition: service_healthy
        working_dir: /app
        environment:
            - WORKON_HOME=/app/.venvs/celery
            - PIPENV_VENV_IN_PROJECT=0
            - HOT_RELOAD=${HOT_RELOAD}
        command: >
            sh -c "pipenv install --dev &&
            if [ \"${HOT_RELOAD:-true}\" = \"true\" ]; then
                echo 'Running Celery with watchmedo auto-restart';
                pipenv run watchmedo auto-restart --directory=./ --pattern=*.py --recursive -- \
                pipenv run celery -A app.worker.celery worker --loglevel=info -Q openai_queue --pool=threads --concurrency=5;
            else
                echo 'Running Celery normally';
                pipenv run celery -A app.worker.celery worker --loglevel=info -Q openai_queue --pool=threads --concurrency=5;
            fi"

    mongodb:
        image: brayand/fullstack-project-template-mongodb:1.0.0
        restart: always
        ports:
            - "${FORWARD_MONGO_DB_PORT:-27017}:27017"
        environment:
            - MONGO_INITDB_ROOT_USERNAME=${MONGO_DB_USERNAME}
            - MONGO_INITDB_ROOT_PASSWORD=${MONGO_DB_PASSWORD}
        volumes:
            - mongo-data:/data/db
        networks:
            - multi-cv-local
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 3

    mongo-express:
        image: brayand/fullstack-project-template-mongo-express:1.0.0
        restart: always
        ports:
            - "8081:8081"
        environment:
            - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_DB_USERNAME}
            - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_DB_PASSWORD}
            - ME_CONFIG_MONGODB_PORT=${MONGO_DB_PORT}
            - ME_CONFIG_MONGODB_SERVER=${MONGO_DB_HOST}
            - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USERNAME}
            - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD}
        networks:
            - multi-cv-local
        depends_on:
            mongodb:
                condition: service_healthy

    engine_redis:
        restart: always
        build:
            context: .
            dockerfile: docker/Dockerfile-redis
            args:
                REDIS_PASSWORD: ${REDIS_PASSWORD}
        ports:
            - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
        networks:
            - multi-cv-local
        volumes:
            - redis-data:/data
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    rabbitmq:
        image: brayand/fullstack-project-template-rabbitmq:1.0.0
        networks:
            - multi-cv-local
        restart: always
        environment:
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
            - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST}
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            timeout: 5s
            retries: 3
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq

    flower:
        build:
            context: .
            dockerfile: docker/Dockerfile-flower
        ports:
            - "5555:5555"
        networks:
            - multi-cv-local
        environment:
            FLOWER_BASIC_AUTH: ${FLOWER_USER}:${FLOWER_PASSWORD}
            FLOWER_BROKER_API: http://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:15672/api/
            CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@${RABBITMQ_HOST}:${RABBITMQ_PORT}/${RABBITMQ_VHOST}
            CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB_NUMBER}
        depends_on:
            celery:
                condition: service_started
            engine_redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        restart: always

networks:
    multi-cv-local:
        driver: bridge
        external: true

volumes:
    mongo-data:
    redis-data:
    rabbitmq-data:
