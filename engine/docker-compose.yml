services:
  engine:
    user: "${UID:-1000}:${GID:-1000}"
    image: brayand/fullstack-project-template-python:1.0.0
    restart: always
    volumes:
      - .:/app
    ports:
      - 91:90
    networks:
      - multi-cv-local
    working_dir: /app
    environment:
      - export PIPENV_VENV_IN_PROJECT=0
    command: sh -c "pipenv install --dev && pipenv run uvicorn app.main:app --reload --host 0.0.0.0 --port 90"
  
  celery:
    user: "${UID:-1000}:${GID:-1000}"
    image: brayand/fullstack-project-template-python:1.0.0
    restart: always
    volumes:
      - .:/app
    networks:
      - multi-cv-local
    working_dir: /app
    command: sh -c "pipenv install --dev && pipenv run celery -A app.celery worker --loglevel=info --pool=threads --concurrency=100"

  engine_redis:
    restart: always
    build:
        context: .
        dockerfile: docker/Dockerfile-redis
    ports:
        - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
    networks:
        - multi-cv-local
    healthcheck:
        test:
            - CMD
            - redis-cli
            - ping
        retries: 3
        timeout: 5s

  rabbitmq:
    image: brayand/fullstack-project-template-rabbitmq:1.0.0
    networks:
        - multi-cv-local
    restart: always
    environment:
        - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
        - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
        - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST}
    healthcheck:
        test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
        timeout: 5s
        retries: 3


networks:
  multi-cv-local:
    driver: bridge
    external: true
