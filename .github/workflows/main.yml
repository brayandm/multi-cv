name: multi-cv

on:
    workflow_dispatch:

jobs:
    build:
        runs-on:
            - self-hosted
        steps:
            - uses: actions/checkout@v3
            - name: Copying .env to frontend project
              run: echo "${{ vars.PROD_FRONTEND }}" > frontend/.env
            - name: Copying .env to backend project
              run: echo "${{ vars.PROD_BACKEND }}" > backend/.env
            - name: Copying .env to engine project
              run: echo "${{ vars.PROD_ENGINE }}" > engine/.env
            - name: Building the containers
              run: bash build.sh

    test:
        needs: build
        runs-on:
            - self-hosted
        steps:
            - uses: actions/checkout@v3
            - name: Run tests
              run: bash run-tests.sh

    deploy:
        if: github.event_name == 'workflow_dispatch'
        needs: test
        runs-on:
            - self-hosted
        steps:
            - uses: actions/checkout@v3
            - name: Stopping the containers
              run: docker compose down
            - name: Removing backend code volume
              run: docker volume rm multi-cv_backend-app || true
            - name: Starting the containers
              run: docker compose up -d

    e2e:
        if: github.event_name == 'workflow_dispatch'
        needs: deploy
        runs-on:
            - self-hosted
        steps:
            - name: Run E2E tests in Docker
              run: |
                  docker run --rm \
                    --init \
                    --ipc=host \
                    --cap-add=SYS_ADMIN \
                    -v ${{ github.workspace }}/playwright-report:/tests/playwright-report \
                    -v ${{ github.workspace }}/frontend:/tests \
                    -w /tests \
                    mcr.microsoft.com/playwright:v1.52.0-noble \
                    npx playwright test

            - name: Upload Playwright HTML report
              if: always()
              uses: actions/upload-artifact@v3
              with:
                  name: playwright-report
                  path: playwright-report

    clean:
        if: always()
        needs: deploy
        runs-on:
            - self-hosted
        steps:
            - name: Removing unused docker images
              run: docker system prune -f
